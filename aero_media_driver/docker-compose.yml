version: '3.9'
services:
  aeron_media_driver:
    container_name: aeron_media_driver
    image: aeron_media_driver
    ipc: "host"
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - LD_LIBRARY_PATH=/root/aeron/lib/:${LD_LIBRARY_PATH}
    command: /root/aeron/bin/aeronmd -DAERON_DIR=/dev/shm/aeron/  -DAERON_PRINT_CONFIGURATION=true  -DAERON_EVENT_LOG=0xFFFF -DAERON_EVENT_LOG=all