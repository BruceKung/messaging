[package]
name = "ft_aeron_example"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
messaging = { path = "../messaging" }
crossbeam = "0.8.1"
protobuf = "2"
clap = { version = "4.1.1", features = ["derive"] }

[build-dependencies]
protoc-rust = "2.20.0"

[[bin]]
name = "example_publisher"
path = "src/publish.rs"

[[bin]]
name = "example_subscriber"
path = "src/subscribe.rs"

[[bin]]
name = "example_requester"
path = "src/request.rs"

[[bin]]
name = "example_responser"
path = "src/response.rs"
